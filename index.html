<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/background.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/clock.css">

<head>
    <meta charset="UTF-8">
    <title>Sam's Corner</title> <!Title of the tab>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>

<audio id="samEngineStart" preload="auto">
    <source src="./ambience/sfx/samEngineStart.wav">
</audio>


<body>
<div class="titleContainer">
    <h1 id="mainTitle"></h1>
    <div class="titleTopRowContainer">
        <div class="titleTopRowAccent"></div>
        <div class="titleBackgroundTopPolygon"></div>
        <div class="titleBackgroundTopPolygonFade"></div>
    </div>

    <div class="titleBackgroundBottomRowContainer">
        <div class="titleBackgroundBottomMainPolygon"></div>

        <div class="titleBackgroundBottomFlairPolygonBackground">
            <div class="titleBackgroundBottomFlairPolygon"></div>
        </div>
    </div>


</div>


<div id="time"></div>

<div class="bottomFlairContainer">
    <div class="bottomFlairSecondaryPolygon"></div>
    <div class="bottomFlairMainAccent"></div>
    <div class="bottomFlairMainPolygon"></div>
</div>

<div class="mainModal" id="welcomeModal">
    <div class="modalContent">
        <div class="modalBody">
            <h3 class="modalWelcomeToTitle">Welcome to</h3>
            <h1 class="modalSamCornerTitle"><i>SAM'S CORNER</i></h1>
            <p class="modalMainContextText">Enjoy the relaxing atmosphere and music with Sam, learn more about him or view my other projects!</p>

            <div class="modalButtonContainer">
                <div class="modalPrimaryButton" id="relax">Relax with Sam</div>
                <div class="modalSecondaryButton" id="viewOther">View my other projects</div>
            </div>
        </div>
        <div class="modalCloseButton" id="close">(x)</div>
    </div>
</div>

<div class="mainClockContainer" id="clockContainter">

</div>


<script src="js/title.js"></script>
<script src="js/modal.js"></script>

</body>
</html>
